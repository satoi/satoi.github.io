---
layout: default
---
<p class="post-date">{{ page.date | date: "%Y/%m/%d" }}</p>
<h1 class="post-title">{{ page.title }}</h1>

{% if page.image %}
<img class="post-image" src="{{ page.image }}" alt="">
{% endif %}

<div class="post-body">
  {{ content }}
</div>

<div class="post-nav">
  <div class="nav-prev">
    {% if page.previous %}
    <a href="{{ page.previous.url | relative_url }}">
      <span class="nav-label">&lt; PREV</span>
      <span class="nav-title">{{ page.previous.title }}</span>
    </a>
    {% endif %}
  </div>
  <div class="divider"></div>
  <div class="nav-next">
    {% if page.next %}
    <a href="{{ page.next.url | relative_url }}">
      <span class="nav-title">{{ page.next.title }}</span>
      <span class="nav-label">NEXT &gt;</span>
    </a>
    {% endif %}
  </div>
</div>
